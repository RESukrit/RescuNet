<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescuNet - Emergency SOS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 400px; margin: auto; }
        h1 { color: #ff4d4d; }
        input, select {
            width: 100%; padding: 12px; margin: 8px 0;
            box-sizing: border-box; border-radius: 6px; border: 1px solid #444;
            background: #222; color: white; font-size: 16px;
        }
        .sos-btn {
            background-color: #ff3333;
            color: white; border: none; padding: 25px; width: 100%;
            font-size: 24px; font-weight: bold; border-radius: 12px;
            cursor: pointer; margin-top: 15px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.6);
        }
        .sos-btn:active { background-color: #b30000; }
        #status { margin-top: 20px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 RescuNet SOS</h1>
        <p>Press the button to broadcast your location to search-and-rescue teams.</p>

        <input type="text" id="name" placeholder="Your Name" value="Victim 1">
        <select id="condition">
            <option value="Trapped under debris">Trapped under debris</option>
            <option value="Medical Emergency">Medical Emergency</option>
            <option value="Trapped in a fire">Trapped in a fire</option>>
            <option value="Cut off by floodwater">Cut off by floodwater</option>
        </select>

        <button class="sos-btn" onclick="sendSOS()">SEND EMERGENCY SOS</button>
        <div id="status"></div>
    </div>

    <script>
        function sendSOS() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Acquiring GPS coordinates...";
            statusDiv.style.color = "#ffcc00";

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const payload = {
                            name: document.getElementById('name').value,
                            condition: document.getElementById('condition').value,
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            time: new Date().toLocaleTimeString()
                        };
                        dispatchSignal(payload);
                    },
                    (error) => {
                        alert("GPS unavailable or denied. Sending simulated location for testing.");
                        // Default testing location if real GPS is disabled
                        const payload = {
                            name: document.getElementById('name').value,
                            condition: document.getElementById('condition').value,
                            lat: 10.053,
                            lng: 76.627,
                            time: new Date().toLocaleTimeString()
                        };
                        dispatchSignal(payload);
                    }
                );
            }
        }

        function dispatchSignal(payload) {
            fetch('/api/sos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                const statusDiv = document.getElementById('status');
                statusDiv.innerText = "✅ SOS SIGNAL BROADCASTED!";
                statusDiv.style.color = "#00ff66";
            })
            .catch(err => {

                document.getElementById('status').innerText = "❌ Network error sending SOS.";
            });
        }
    </script>
</body>
</html>
