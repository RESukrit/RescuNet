<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RescuNet - Victim Emergency SOS</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .card { max-width: 400px; margin: 0 auto; background: #111; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        h1 { color: #ff4d4d; margin-bottom: 5px; }
        select, input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; font-size: 16px; }
        .sos-btn { background: #ff3333; color: #fff; padding: 20px; border: none; font-size: 20px; font-weight: bold; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 10px; box-shadow: 0 0 15px rgba(255,51,51,0.5); }
        .sos-btn:active { background: #b30000; }
        #status-box { margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚨 RescuNet SOS</h1>
        <p style="color:#aaa; font-size: 14px;">Peer-to-Peer Distress Beacon</p>

        <input type="text" id="victim-name" value="Victim 1" placeholder="Name">
        <select id="victim-condition">
            <option value="Trapped under debris">Trapped under debris</option>
            <option value="Medical Emergency">Medical Emergency</option>
            <option value="Cut off by floodwater">Cut off by floodwater</option>
        </select>

        <button class="sos-btn" onclick="dispatchSOS()">TRANSMIT SOS</button>
        <div id="status-box"></div>
    </div>

    <script>
        // Automatically listen for network reconnect and flush the offline buffer
window.addEventListener('online', () => {
    const cachedSOS = localStorage.getItem('cached_sos');
    if (cachedSOS) {
        fetch('/api/sos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: cachedSOS
        })
        .then(res => res.json())
        .then(() => {
            localStorage.removeItem('cached_sos');
            const status = document.getElementById('status-box');
            status.innerText = "⚡ Connection restored! P2P Buffer flushed to Command Center.";
            status.style.color = "#00ff66";
        });
    }
});
        async function dispatchSOS() {
            const status = document.getElementById('status-box');
            status.innerText = "Gathering telemetry (GPS & Battery)...";
            status.style.color = "#ffcc00";

            let batteryLevel = 85;
            if (navigator.getBattery) {
                try {
                    const bat = await navigator.getBattery();
                    batteryLevel = Math.round(bat.level * 100);
                } catch(e) {}
            }

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => sendPayload(pos.coords.latitude, pos.coords.longitude, batteryLevel),
                    () => sendPayload(10.053, 76.627, batteryLevel) // Default coordinate fallback
                );
            } else {
                sendPayload(10.053, 76.627, batteryLevel);
            }
        }

        function sendPayload(lat, lng, battery) {
            const payload = {
                name: document.getElementById('victim-name').value,
                condition: document.getElementById('victim-condition').value,
                lat: lat,
                lng: lng,
                battery: battery,
                time: new Date().toLocaleTimeString()
            };

            fetch('/api/sos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(() => {
                const status = document.getElementById('status-box');
                status.innerText = "✅ SOS SIGNAL DISPATCHED TO DASHBOARD";
                status.style.color = "#00ff66";
            })
            .catch(() => {
                // Offline fallback: cache to localStorage
                localStorage.setItem('cached_sos', JSON.stringify(payload));
                const status = document.getElementById('status-box');
                status.innerText = "⚠️ Network isolated. Packet stored in local P2P buffer!";
                status.style.color = "#ff9900";
            });
        }
    </script>
</body>
</html>
